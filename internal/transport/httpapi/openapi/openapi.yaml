  responses:
    BadRequest:
      description: The request parameters or JSON body are invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The browser session is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated account cannot perform this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with an existing resource or assignment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The account has reached a temporary operation limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaResetBadRequest:
      description: The required idempotency key is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuotaResetBadRequestError' }
    QuotaResetConflict:
      description: The requested quota-reset operation cannot be applied in the current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuotaResetConflictError' }
    InternalError:
      description: The server could not complete the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: The operation completed successfully and has no response body.
    OpenAPIDocumentResponse:
      description: Runtime OpenAPI 3.0 document.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    UserProfileResponse:
      description: Current account profile.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserProfile' }
    UsageSummaryResponse:
      description: Usage summary for the selected period.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UsageSummary' }
    QuotaStatusResponse:
