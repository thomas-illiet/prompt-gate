  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Stable machine-readable error code or diagnostic message.
    QuotaResetBadRequestError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [missing_idempotency_key]
    QuotaResetConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - quota_reset_credit_unavailable
            - quota_reset_not_applicable
            - quota_reset_balance_full
            - quota_reset_pending
    AppRole:
      type: string
      enum: [none, limited, user, admin]
    UserType:
      type: string
      enum: [user, service]
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, sub, preferredUsername, email, name, type, role, isActive, lastLoginAt]
      properties:
        id: { type: string, format: uuid }
        sub: { type: string }
        preferredUsername: { type: string, minLength: 1, pattern: '\S' }
        email: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/UserType' }
        role: { $ref: '#/components/schemas/AppRole' }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time }
    AccountSubscriptionPlan:
      type: object
      additionalProperties: false
      required: [id, name, description, quota5hTokens, quota7dTokens, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        quota5hTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
        quota7dTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
        isDefault: { type: boolean }
    AccountQuotaState:
      type: object
      additionalProperties: false
      required: [hasSubscription, planId, planName, used5hTokens, quota5hTokens, reset5hAt, used7dTokens, quota7dTokens, reset7dAt, syncedAt]
      properties:
        hasSubscription: { type: boolean }
        planId: { type: string, format: uuid, nullable: true }
        planName: { type: string }
        used5hTokens: { type: integer, format: int64, minimum: 0 }
        quota5hTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
        reset5hAt: { type: string, format: date-time, nullable: true }
        used7dTokens: { type: integer, format: int64, minimum: 0 }
        quota7dTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
        reset7dAt: { type: string, format: date-time, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, sub, preferredUsername, email, name, type, role, subscriptionPlanId, quotaResetCredits, note, isActive, activeInLast30Days, inputTokens, outputTokens, expiresAt, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sub: { type: string, nullable: true }
        preferredUsername: { type: string, minLength: 1, pattern: '\S' }
        email: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [user]
        role: { $ref: '#/components/schemas/AppRole' }
        subscriptionPlanId: { type: string, format: uuid, nullable: true }
        subscriptionPlan:
          allOf:
            - $ref: '#/components/schemas/AccountSubscriptionPlan'
          nullable: true
        effectiveSubscriptionPlan:
          allOf:
            - $ref: '#/components/schemas/AccountSubscriptionPlan'
          nullable: true
        quotaState:
          allOf:
            - $ref: '#/components/schemas/AccountQuotaState'
          nullable: true
        quotaResetCredits: { type: integer, minimum: 0, maximum: 2 }
        note: { type: string }
        isActive: { type: boolean }
        activeInLast30Days:
          type: boolean
          description: Whether at least one proxy request was recorded from today through 29 days ago, using UTC calendar days.
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUserList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [role, isActive]
      properties:
        role: { $ref: '#/components/schemas/AppRole' }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [preferredUsername]
      properties:
        preferredUsername:
          type: string
          minLength: 1
          pattern: '\S'
          description: Exact, case-sensitive OIDC preferred_username claim. Surrounding whitespace is ignored.
    UpdateAccountNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, maxLength: 2000 }
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, identifier, name, role, subscriptionPlanId, note, isActive, inputTokens, outputTokens, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/AppRole' }
        subscriptionPlanId: { type: string, format: uuid, nullable: true }
        subscriptionPlan:
          allOf:
            - $ref: '#/components/schemas/AccountSubscriptionPlan'
          nullable: true
        effectiveSubscriptionPlan:
          allOf:
            - $ref: '#/components/schemas/AccountSubscriptionPlan'
          nullable: true
        quotaState:
          allOf:
            - $ref: '#/components/schemas/AccountQuotaState'
          nullable: true
        note: { type: string }
        isActive: { type: boolean }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [identifier, name, isActive]
      properties:
        identifier:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
        name: { type: string, minLength: 1 }
        isActive: { type: boolean }
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccount' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
        description: { type: string }
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Human-user keys are limited to 30 days; service-account keys to 365 days.
    Token:
      type: object
      additionalProperties: false
      required: [id, userId, name, description, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }
    CreateTokenResponse:
      type: object
      additionalProperties: false
      required: [token, tokenInfo]
      properties:
        token:
          type: string
          readOnly: true
          description: Raw bearer token, returned only at creation time.
        tokenInfo: { $ref: '#/components/schemas/Token' }
    TokenList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Token' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    CostRates:
      type: object
      additionalProperties: false
      required: [inputUsdPer1MTokens, outputUsdPer1MTokens, embeddingUsdPer1MTokens]
      properties:
        inputUsdPer1MTokens: { type: number, format: double, minimum: 0 }
        outputUsdPer1MTokens: { type: number, format: double, minimum: 0 }
        embeddingUsdPer1MTokens: { type: number, format: double, minimum: 0 }
    EstimatedCost:
      type: object
      additionalProperties: false
      required: [inputUsd, outputUsd, embeddingUsd, totalUsd, rates]
      properties:
        inputUsd: { type: number, format: double, minimum: 0 }
        outputUsd: { type: number, format: double, minimum: 0 }
        embeddingUsd: { type: number, format: double, minimum: 0 }
        totalUsd: { type: number, format: double, minimum: 0 }
        rates: { $ref: '#/components/schemas/CostRates' }
    UsageTotals:
      type: object
      additionalProperties: false
      required: [requests, toolCalls, inputTokens, outputTokens, cacheReadInputTokens, cacheWriteInputTokens, completionInputTokens, completionOutputTokens, completionTokens, embeddingTokens, totalTokens]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        toolCalls: { type: integer, format: int64, minimum: 0 }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadInputTokens: { type: integer, format: int64, minimum: 0 }
        cacheWriteInputTokens: { type: integer, format: int64, minimum: 0 }
        completionInputTokens: { type: integer, format: int64, minimum: 0 }
        completionOutputTokens: { type: integer, format: int64, minimum: 0 }
        completionTokens: { type: integer, format: int64, minimum: 0 }
        embeddingTokens: { type: integer, format: int64, minimum: 0 }
        totalTokens: { type: integer, format: int64, minimum: 0 }
        estimatedCost: { $ref: '#/components/schemas/EstimatedCost' }
    DailyUsage:
      type: object
      additionalProperties: false
      required: [date, requests, toolCalls, inputTokens, outputTokens, completionInputTokens, completionOutputTokens, completionTokens, embeddingTokens, totalTokens]
      properties:
        date: { type: string, format: date }
        requests: { type: integer, format: int64, minimum: 0 }
        toolCalls: { type: integer, format: int64, minimum: 0 }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        completionInputTokens: { type: integer, format: int64, minimum: 0 }
        completionOutputTokens: { type: integer, format: int64, minimum: 0 }
        completionTokens: { type: integer, format: int64, minimum: 0 }
        embeddingTokens: { type: integer, format: int64, minimum: 0 }
        totalTokens: { type: integer, format: int64, minimum: 0 }
        estimatedCost: { $ref: '#/components/schemas/EstimatedCost' }
    UsageBreakdown:
      type: object
      additionalProperties: false
      required: [name, requests, totalTokens]
      properties:
