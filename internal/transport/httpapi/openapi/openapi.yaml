openapi: 3.0.3
info:
  title: Prompt Gate Control API
  version: 1.0.0
  description: |
    Administrative and self-service API for Prompt Gate. Browser clients
    authenticate with the current HTTP-only session cookie.
servers:
  - url: __PROMPTGATE_BACKEND_BASE_URL__
security:
  - sessionCookie: []
tags:
  - name: Current account
    description: Current account profile, quota, groups, and usage.
  - name: Dashboard
    description: Personal and organization usage dashboards.
  - name: Tokens
    description: Prompt Gate virtual-key lifecycle.
  - name: Users
    description: Human user administration.
  - name: Service accounts
    description: Service-account administration.
  - name: Groups
    description: Access groups, memberships, and model policies.
  - name: Subscriptions
    description: Subscription plans, assignments, and quota state.
  - name: Providers
    description: Upstream LLM provider configuration and model discovery.
  - name: Pricing
    description: Usage-cost pricing configuration.
  - name: Monitoring
    description: User-visible status and administrator-managed HTTP checks.
  - name: FAQ
    description: Published and administrator-managed frequently asked questions.
  - name: Guides
    description: Provider setup help and administrator-managed setup guides.
  - name: Model Lab
    description: Group-filtered model catalog and one-use playground authorization.
  - name: Documentation
    description: Runtime OpenAPI document.
paths:
  /api/v1/me:
    get:
      tags: [Current account]
      operationId: getCurrentUser
      summary: Get the current account profile
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/UserProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/usage:
    get:
      tags: [Current account]
      operationId: getCurrentUserUsage
      summary: Get the current user's usage summary
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageDays'
      responses:
        '200': { $ref: '#/components/responses/UsageSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/quota:
    get:
      tags: [Current account]
      operationId: getCurrentUserQuota
      summary: Get the current account quota state
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/QuotaStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/quota-resets:
    get:
      tags: [Current account]
      operationId: getCurrentUserQuotaResets
      summary: Get the current account quota-reset wallet
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/QuotaResetSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/quota-resets/use:
    post:
      tags: [Current account]
      operationId: useCurrentUserQuotaReset
      summary: Spend one credit and clear both live quota windows
      description: >-
        Clears the rolling 5-hour and 7-day quota windows without deleting usage analytics.
        An applied response includes the refreshed live quota. A pending response omits quota
        until background reconciliation completes.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/QuotaResetUseAppliedResponse' }
        '202': { $ref: '#/components/responses/QuotaResetUsePendingResponse' }
        '400': { $ref: '#/components/responses/QuotaResetBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/QuotaResetConflict' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/quota-resets/history:
    get:
      tags: [Current account]
      operationId: listCurrentUserQuotaResetHistory
      summary: List applied quota-reset wallet events
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/QuotaResetPageSize'
      responses:
        '200': { $ref: '#/components/responses/QuotaResetHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/groups:
    get:
      tags: [Current account]
      operationId: listCurrentUserGroups
      summary: List the current user's access groups
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/ProfileGroupsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/help/setup:
    get:
      tags: [Guides]
      operationId: getCurrentUserSetupHelp
      summary: Get provider and client setup help
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/HelpSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/models:
    get:
      tags: [Model Lab]
      operationId: getCurrentUserModelCatalog
      summary: Get the current user's Model Lab catalog
      description: Returns only provider/model pairs authorized by the current account's access groups. Responses never expose provider credentials or upstream URLs.
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/ModelLabCatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/model-lab/tickets:
    post:
      tags: [Model Lab]
      operationId: issueCurrentUserModelLabTickets
      summary: Issue one-use Model Lab tickets
      description: Issues one short-lived ticket per authorized target. Prompts are sent directly to the canonical proxy and never pass through this endpoint.
      security:
        - sessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/ModelLabTickets'
      responses:
        '201': { $ref: '#/components/responses/ModelLabTicketsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/overview:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardOverview
      summary: Get the current user's dashboard overview
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardOverviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/tokens:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardTokens
      summary: Get the current user's token totals
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardTokensResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/messages:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardMessages
      summary: Get the current user's message total
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardMessagesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/duration:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardDuration
      summary: Get the current user's request duration total
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardDurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/activity:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardActivity
      summary: Get the current user's daily activity
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityUsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardActivityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/top-models:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardTopModels
      summary: Get the current user's top models
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
        - $ref: '#/components/parameters/BreakdownMetric'
      responses:
        '200': { $ref: '#/components/responses/DashboardBreakdownResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/top-provider-names:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardTopProviderNames
      summary: Get the current user's top provider names
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
        - $ref: '#/components/parameters/BreakdownMetric'
      responses:
        '200': { $ref: '#/components/responses/DashboardBreakdownResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/me/dashboard/top-provider-types:
    get:
      tags: [Dashboard]
      operationId: getCurrentUserDashboardTopProviderTypes
      summary: Get the current user's top provider types
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
        - $ref: '#/components/parameters/BreakdownMetric'
      responses:
        '200': { $ref: '#/components/responses/DashboardBreakdownResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/monitoring/status:
    get:
      tags: [Monitoring]
      operationId: getMonitoringStatus
      summary: Get user-visible service status
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/MonitoringStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/faq:
    get:
      tags: [FAQ]
      operationId: listPublishedFaqs
      summary: List published FAQ entries
      security:
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/PublicFAQListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/tokens:
    get:
      tags: [Tokens]
      operationId: listCurrentUserTokens
      summary: List the current user's virtual keys
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/TokenStatus'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200': { $ref: '#/components/responses/TokenListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Tokens]
      operationId: createCurrentUserToken
      summary: Create a virtual key for the current user
      security:
        - sessionCookie: []
      requestBody:
        $ref: '#/components/requestBodies/CreateToken'
      responses:
        '201': { $ref: '#/components/responses/CreateTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    delete:
      tags: [Tokens]
      operationId: revokeCurrentUserToken
      summary: Revoke one of the current user's virtual keys
      security:
        - sessionCookie: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/openapi.json:
    get:
      tags: [Documentation]
      operationId: getAdminOpenAPIDocument
      summary: Get the runtime OpenAPI document
      responses:
        '200': { $ref: '#/components/responses/OpenAPIDocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users:
    get:
      tags: [Users]
      operationId: listAdminUsers
      summary: List human users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/AccountStatus'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200': { $ref: '#/components/responses/AdminUserListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Users]
      operationId: createAdminUser
      summary: Pre-create a human user from an OIDC preferred username
      description: >-
        Creates an active local account with role limited before its first SSO
        login. A virtual key issued by an administrator can authenticate this
        account immediately without waiting for SSO; normal key, account,
        group, quota, and policy checks still apply. The exact, case-sensitive
        preferred_username claim links the OIDC identity later without replacing
        application-managed access. An empty UID returns invalid_preferred_username
        and an existing human UID returns preferred_username_conflict.
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        '201': { $ref: '#/components/responses/AdminUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Users]
      operationId: getAdminUser
      summary: Get one human user
      responses:
        '200': { $ref: '#/components/responses/AdminUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Users]
      operationId: updateAdminUser
      summary: Update a human user's access
      requestBody:
        $ref: '#/components/requestBodies/UpdateUser'
      responses:
        '200': { $ref: '#/components/responses/AdminUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Users]
      operationId: deleteAdminUser
      summary: Delete a human user
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/statistics:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Users]
      operationId: getAdminUserStatistics
      summary: Get usage statistics for a human user
      parameters:
        - $ref: '#/components/parameters/UsageWindow'
        - $ref: '#/components/parameters/LegacyUsageDays'
      responses:
        '200': { $ref: '#/components/responses/DashboardOverviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/ips:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Users]
      operationId: listAdminUserIPAddresses
      summary: List observed client IP addresses for a human user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200': { $ref: '#/components/responses/AccountIPAddressListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Users]
      operationId: clearAdminUserIPAddresses
      summary: Clear observed client IP addresses for a human user
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/note:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Users]
      operationId: updateAdminUserNote
      summary: Update the private note for a human user
      requestBody:
        $ref: '#/components/requestBodies/UpdateAccountNote'
      responses:
        '200': { $ref: '#/components/responses/AdminUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Tokens]
      operationId: listAdminUserTokens
      summary: List virtual keys for a human user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200': { $ref: '#/components/responses/TokenListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Tokens]
      operationId: createAdminUserToken
      summary: Create a virtual key for a human user
      requestBody:
        $ref: '#/components/requestBodies/CreateToken'
      responses:
        '201': { $ref: '#/components/responses/CreateTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/TokenID'
    delete:
      tags: [Tokens]
      operationId: revokeAdminUserToken
      summary: Revoke a human user's virtual key
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/groups:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Groups]
      operationId: listAdminUserGroups
      summary: List access groups assigned to a human user
      responses:
        '200': { $ref: '#/components/responses/GroupListArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Groups]
      operationId: replaceAdminUserGroups
      summary: Replace access groups assigned to a human user
      requestBody:
        $ref: '#/components/requestBodies/ReplaceUserGroups'
      responses:
        '200': { $ref: '#/components/responses/GroupListArrayResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/users/{id}/subscription-plan:
    parameters:
