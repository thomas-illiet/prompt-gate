      required: [comparisonId, expiresAt, tickets]
      properties:
        comparisonId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        tickets:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/ModelLabTicket' }
