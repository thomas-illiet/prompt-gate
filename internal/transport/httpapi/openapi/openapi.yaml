components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __PROMPTGATE_SESSION_COOKIE_NAME__
      description: Current HTTP-only Prompt Gate browser session cookie.
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    TokenID:
      name: tokenId
      in: path
      required: true
      description: Virtual-key UUID.
      schema:
        type: string
        format: uuid
    UserID:
      name: userId
      in: path
      required: true
      description: Account UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: One-based result page.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    QuotaResetPageSize:
      name: pageSize
      in: query
      description: Maximum number of quota-reset events per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key reused when retrying the same mutation.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '\S'
    Search:
      name: search
      in: query
      description: Case-insensitive free-text search.
      schema:
        type: string
    SortBy:
      name: sortBy
      in: query
      description: Resource-specific sort field.
      schema:
        type: string
    SortDir:
      name: sortDir
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
    UserRole:
      name: role
      in: query
      description: Filter human users by application role.
      schema:
        $ref: '#/components/schemas/AppRole'
    AccountStatus:
      name: status
      in: query
      description: Filter accounts by active state.
      schema:
        type: string
        enum: [active, inactive]
    TokenStatus:
      name: status
      in: query
      description: Filter virtual keys by lifecycle status.
      schema:
        type: string
        enum: [active, expired, revoked]
    IncludeRevoked:
      name: includeRevoked
      in: query
      description: Include revoked virtual keys.
      schema:
        type: boolean
        default: false
    UsageDays:
      name: days
      in: query
      description: Usage-summary period in days.
      schema:
        type: integer
        enum: [7, 30]
        default: 30
    LegacyUsageDays:
      name: days
      in: query
      description: Legacy alias for a 7-day or 30-day dashboard window. Omit when window is set.
      schema:
        type: integer
        enum: [7, 30]
    UsageWindow:
      name: window
      in: query
      description: Dashboard reporting window.
      schema:
        type: string
        enum: [7d, 30d, all]
        default: 30d
    ActivityUsageWindow:
      name: window
      in: query
      description: Personal activity reporting window.
      schema:
        type: string
        enum: [7d, 30d, 365d, all]
        default: 30d
    BreakdownMetric:
      name: metric
      in: query
      description: Metric used to rank dashboard breakdown items.
      schema:
        type: string
        enum: [requests, tokens, cost]
        default: tokens
    ProviderID:
      name: providerId
      in: query
      description: Provider UUID. May be repeated.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
    ProviderIDs:
      name: providerIds
      in: query
      description: Comma-separated provider UUIDs. May also be repeated.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: false
  requestBodies:
    ModelLabTickets:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModelLabTicketRequest'
    CreateToken:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTokenRequest'
    CreateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
    UpdateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
