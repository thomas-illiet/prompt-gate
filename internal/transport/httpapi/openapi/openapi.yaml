      type: object
      additionalProperties: false
      required: [currency, unit, input, output, source]
      properties:
        currency: { type: string, enum: [USD] }
        unit: { type: string, enum: [1M_tokens] }
        input: { type: number, format: double, minimum: 0, nullable: true }
        output: { type: number, format: double, minimum: 0, nullable: true }
        source: { $ref: '#/components/schemas/ModelLabPriceSource' }
    ModelLabObservedAvailability:
      type: object
      additionalProperties: false
      required: [state, windowSeconds, sampleSize, successRate, ttftP50Ms, durationP50Ms, lastObservedAt]
      properties:
        state: { $ref: '#/components/schemas/ModelLabAvailabilityState' }
        windowSeconds: { type: integer, format: int64, minimum: 0 }
        sampleSize: { type: integer, format: int64, minimum: 0 }
        successRate: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }
        ttftP50Ms: { type: integer, format: int64, minimum: 0, nullable: true }
        durationP50Ms: { type: integer, format: int64, minimum: 0, nullable: true }
        lastObservedAt: { type: string, format: date-time, nullable: true }
    ModelLabModel:
      type: object
      additionalProperties: false
      required: [id, displayName, pricing, playground, observedAvailability]
      properties:
        id: { type: string, minLength: 1 }
        displayName: { type: string, nullable: true }
        pricing: { $ref: '#/components/schemas/ModelLabPricing' }
        playground:
          type: object
          additionalProperties: false
          required: [supported, protocol]
          properties:
            supported: { type: boolean }
            protocol: { $ref: '#/components/schemas/ModelLabProtocol' }
        observedAvailability: { $ref: '#/components/schemas/ModelLabObservedAvailability' }
    ModelLabProvider:
      type: object
      additionalProperties: false
      required: [name, displayName, type, catalog, models]
      properties:
        name: { type: string, minLength: 1 }
        displayName: { type: string }
        type: { type: string, enum: [openai, ollama, anthropic] }
        catalog:
          type: object
          additionalProperties: false
          required: [state, fetchedAt]
          properties:
            state: { $ref: '#/components/schemas/ModelLabCatalogState' }
            fetchedAt: { type: string, format: date-time, nullable: true }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelLabModel' }
    ModelLabCatalog:
      type: object
      additionalProperties: false
      required: [generatedAt, limits, providers]
      properties:
        generatedAt: { type: string, format: date-time }
        limits:
          type: object
          additionalProperties: false
          required: [maxTargets, maxPromptBytes, maxOutputTokens]
          properties:
            maxTargets: { type: integer, minimum: 1, maximum: 3 }
            maxPromptBytes: { type: integer, format: int64, minimum: 1 }
            maxOutputTokens: { type: integer, minimum: 1 }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ModelLabProvider' }
    ModelLabTarget:
      type: object
      additionalProperties: false
      required: [providerName, model]
      properties:
        providerName: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
