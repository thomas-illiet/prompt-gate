      type: object
      additionalProperties: false
      required: [providerName, model, protocol, method, endpoint, token]
      properties:
        providerName: { type: string }
        model: { type: string }
        protocol: { $ref: '#/components/schemas/ModelLabProtocol' }
        method: { type: string, enum: [POST] }
        endpoint: { type: string, format: uri }
