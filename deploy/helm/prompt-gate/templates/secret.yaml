{{- if not .Values.configSecret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prompt-gate.configSecretName" . }}
  labels:
    {{- include "prompt-gate.labels" . | nindent 4 }}
  {{- if or .Values.argoCd.enabled .Values.configSecret.annotations }}
  annotations:
    {{- if .Values.argoCd.enabled }}
    argocd.argoproj.io/sync-wave: {{ .Values.argoCd.syncWaves.config | quote }}
    {{- end }}
    {{- with .Values.configSecret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{ include "prompt-gate.configSecretKey" . | quote }}: |
    {{- include "prompt-gate.runtimeConfig" . | nindent 4 }}
{{- end }}
