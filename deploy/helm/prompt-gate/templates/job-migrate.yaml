{{- if .Values.migrate.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "prompt-gate.fullname" . }}-migrate
  labels:
    {{- include "prompt-gate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- if .Values.argoCd.enabled }}
    argocd.argoproj.io/sync-wave: {{ .Values.argoCd.syncWaves.migrate | quote }}
    {{- if .Values.migrate.hook.enabled }}
    argocd.argoproj.io/hook: {{ .Values.migrate.hook.phase | quote }}
    argocd.argoproj.io/hook-delete-policy: {{ .Values.migrate.hook.deletePolicy | quote }}
    {{- end }}
    {{- else }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "prompt-gate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.migrate.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.configSecret.existingSecret }}
        prompt-gate.io/config-rollout: {{ .Values.configSecret.rolloutToken | toString | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.migrate.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: {{ if .Values.argoCd.enabled }}{{ include "prompt-gate.serviceAccountName" . }}{{ else }}default{{ end }}
      {{- include "prompt-gate.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "prompt-gate.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "prompt-gate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/promptgate
            - --config
            - /etc/prompt-gate/promptgate.yaml
            - migrate
          securityContext:
            {{- include "prompt-gate.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            {{- include "prompt-gate.configVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if and (not .Values.argoCd.enabled) (not .Values.configSecret.existingSecret) }}
        - name: promptgate-config
          secret:
            secretName: {{ include "prompt-gate.fullname" . }}-migrate-config
            defaultMode: 0440
            items:
              - key: {{ include "prompt-gate.configSecretKey" . | quote }}
                path: promptgate.yaml
        {{- else }}
        {{- include "prompt-gate.configVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "prompt-gate.podPlacement" . | nindent 6 }}
{{- end }}
