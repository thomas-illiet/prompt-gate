{{- if and .Values.ingress.enabled .Values.proxy.enabled -}}
{{- $proxyAnnotations := deepCopy (default dict .Values.ingress.proxy.annotations) -}}
{{- if and .Values.ingress.proxy.stripPath (not (hasKey $proxyAnnotations "haproxy.org/path-rewrite")) -}}
{{- $_ := set $proxyAnnotations "haproxy.org/path-rewrite" (printf "^%s(/|$)(.*) /\\2" (trimSuffix "/" .Values.ingress.proxyPath)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "prompt-gate.fullname" . }}-proxy
  labels:
    {{- include "prompt-gate.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  annotations:
    {{- if .Values.argoCd.enabled }}
    argocd.argoproj.io/sync-wave: {{ .Values.argoCd.syncWaves.ingress | quote }}
    {{- end }}
    {{- with $proxyAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.proxyPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "prompt-gate.fullname" . }}-proxy
                port:
                  number: {{ .Values.proxy.service.port }}
{{- end }}
