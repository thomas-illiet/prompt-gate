{{- include "prompt-gate.validateOTelApiKey" . -}}
{{- $value := include "prompt-gate.otelApiKeyValue" . -}}
{{- $existing := default "" .Values.otelApiKey.existingSecret.name | toString | trim -}}
{{- if and .Values.proxy.enabled (ne $value "") (eq $existing "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prompt-gate.otelApiKeySecretName" . }}
  labels:
    {{- include "prompt-gate.labels" . | nindent 4 }}
  {{- if .Values.argoCd.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argoCd.syncWaves.config | quote }}
  {{- end }}
type: Opaque
data:
  PROMPTGATE_OTEL_API_KEY: {{ $value | b64enc | quote }}
{{- end }}
