{{- if and .Values.migrate.enabled (not .Values.argoCd.enabled) (not .Values.configSecret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prompt-gate.fullname" . }}-migrate-config
  labels:
    {{- include "prompt-gate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{ include "prompt-gate.configSecretKey" . | quote }}: |
    {{- include "prompt-gate.runtimeConfig" . | nindent 4 }}
{{- end }}
