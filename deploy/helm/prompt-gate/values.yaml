# Default values for the Prompt Gate chart.
#
# This chart is intended to be used by Argo CD. It deploys only Prompt Gate
# application processes; PostgreSQL, Redis, Keycloak/OIDC, and TLS certificates
# must be managed outside this chart.
#
# The rendered workloads are Kyverno-friendly by default:
# - runAsUser/runAsGroup: 1000
# - readOnlyRootFilesystem: true
# - no Linux capabilities
# - allowPrivilegeEscalation: false
# - resources.requests and resources.limits on every container

# Override only the short chart name used in labels.
nameOverride: ""

# Override the full generated resource name. Leave empty unless your platform
# requires stable names independent from the Helm release name.
fullnameOverride: ""

image:
  # Runtime image containing the Prompt Gate backend binary and static frontend.
  repository: ghcr.io/thomas-illiet/prompt-gate

  # Defaults to Chart.appVersion when empty. Prefer immutable tags in prod.
  tag: ""

  # Use Always only for mutable tags. IfNotPresent is safer for versioned tags.
  pullPolicy: IfNotPresent

# Existing registry pull secrets in the destination namespace.
# Example:
# imagePullSecrets:
#   - name: ghcr-pull-secret
imagePullSecrets: []

argoCd:
  # When enabled, render Argo CD hook and sync-wave annotations.
  # Disable only if this chart is installed directly with Helm.
  enabled: true

  # Argo CD applies lower waves first. The migration Job is a Sync hook, not a
  # PreSync hook, so the configuration Secret and ServiceAccount exist before
  # migrations run.
  syncWaves:
    config: "-20"
    serviceAccount: "-20"
    migrate: "-10"
    service: "-5"
    workload: "0"
    ingress: "10"

serviceAccount:
  # Create a dedicated ServiceAccount with automountServiceAccountToken=false.
  # If false, workloads use serviceAccount.name or "default".
  create: true

  # Existing ServiceAccount name. Leave empty to use the chart fullname.
  name: ""

  # Extra annotations added to the generated ServiceAccount.
  annotations: {}

configSecret:
  # When set, the existing Secret must contain the complete YAML document in
  # the configured key. config.api.port and config.proxy.port must still match
  # the external file because Kubernetes probes reference those container ports.
  existingSecret: ""
  key: promptgate.yaml
  annotations: {}

  # Change this value after rotating an externally managed Secret to trigger a
  # workload rollout. Chart-managed configuration uses an automatic checksum.
  rolloutToken: ""

# Complete Prompt Gate runtime configuration. Because this document includes
# credentials, the chart stores it in a Secret and mounts it read-only in every
# Prompt Gate process.
config:
  common:
    # Required deployment identity shown throughout the UI.
    environment: production
    log:
      level: info
    database:
      url: ""
      connection_max_lifetime: 30m
      max_idle_connections: 5
      max_open_connections: 10
    redis:
      url: ""
      cache_ttl: 5m
      pool_size: null
      min_idle_connections: null
      pool_timeout: null
      read_timeout: null
      write_timeout: null
    tls:
      # Single optional CA bundle used by every outbound TLS client, including OTEL.
      ca_file: ""
    security:
      jwt_secret: ""
      secrets_key: ""
    public_urls:
      # Empty frontend/backend values are derived from the Ingress host. The
      # proxy URL is derived only while the chart-managed proxy Ingress is
      # enabled; otherwise it must be set explicitly and match proxy.base_path.
      frontend: ""
      backend: ""
      proxy: ""
    session:
      cookie_name: promptgate_session
      ttl: 8h
    cors:
      # Empty defaults to the computed frontend URL.
      allowed_origins: []
    model_lab:
      ticket_ttl: 60s
      max_prompt_bytes: 32768
      max_output_tokens: 4096
      max_targets: 3
      max_concurrent: 3
      catalog_fresh_ttl: 5m
      catalog_stale_ttl: 24h
    usage_cost:
      input: 5.00
      output: 30.00
      embedding: 0.02
    maintenance:
      token_cleanup_interval: 1h
      user_access_expiration_interval: 1h
      quota_reset_distribution_interval: 1h
    proxy_reload_debounce: 250ms

  api:
    port: 8080
    static_assets_dir: /app/public
    admin_api_key: ""
    # Optional address shown to authenticated limited users as the
    # administrator contact in the persistent access banner.
    admin_contact_email: ""
    oidc:
      issuer_url: "https://keycloak.example.com/realms/promptgate"
      jwks_url: "https://keycloak.example.com/realms/promptgate/protocol/openid-connect/certs"
      client_id: promptgate-backend
      client_secret: ""
      # Optional exact callback URL registered with the OIDC provider. Empty
      # falls back to <common.public_urls.backend>/auth/callback.
      redirect_url: ""

  proxy:
    port: 8081
    # Optional application-owned public mount path. When the chart-managed
    # Ingress is enabled this is derived from ingress.proxyPath.
    base_path: ""
    # Keep global header trust disabled. List the narrow direct HAProxy peer
    # range and each controlled upstream hop actually present in X-Forwarded-For.
    trust_forward_headers: false
    trusted_proxies: []
    client_ip_debug: false
    debug_requests: false
    max_buffered_request_bytes: 8388608
    max_buffered_response_bytes: 16777216
    upstream_timeout: 2m
    opa:
      enabled: true
      url: "http://prompt-gate-opa:8181"
      policy_path: promptgate/proxy/decision
      timeout: 2s
      cache_ttl: 10m
    otel:
      enabled: false
      endpoint: ""
      api_key: ""
      project_name: prompt-gate
      service_name: promptgate-proxy
      environment: production
      capture_prompts: false
      capture_output: false
      capture_thinking: false
      export_timeout: 10s
      batch_timeout: 5s
      max_queue_size: 2048
      max_export_batch_size: 512
      insecure: false

  worker:
    batch_size: 100
    block_timeout: 5s
    pending_idle_timeout: 30s
    consumer_name: ""

  schedule:
    usage_raw_retention: 2160h
    usage_raw_cleanup_interval: 1h
    subscription_quota_sync_interval: 5m

  migrate: {}

# Extra pod annotations and labels applied to all application Pods.
podAnnotations: {}
podLabels: {}

# Standard Kubernetes scheduling controls applied to all Pods.
nodeSelector: {}
tolerations: []
affinity: {}

# Optional volumes mounted into every container. Useful for private CA bundles.
# Example:
# extraVolumes:
#   - name: custom-ca
#     secret:
#       secretName: promptgate-custom-ca
# extraVolumeMounts:
#   - name: custom-ca
#     mountPath: /run/secrets/custom-ca.pem
#     subPath: custom-ca.pem
#     readOnly: true
extraVolumes: []
extraVolumeMounts: []

api:
  # API server and static frontend process.
  enabled: true
  replicas: 1
  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    port: 8080

  # Requests and limits are mandatory for Kyverno policies.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Liveness uses TCP so the container is not restarted during short DB issues.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

  # Readiness calls /health, which checks database connectivity.
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

proxy:
  # LLM proxy process.
  enabled: true
  replicas: 1
  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    port: 8081

  # Requests and limits are mandatory for Kyverno policies.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

worker:
  # Background worker consuming Redis usage events.
  enabled: true
  replicas: 1
  podAnnotations: {}
  podLabels: {}

  # Requests and limits are mandatory for Kyverno policies.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

schedule:
  # Scheduler process. Keep replicas at 1 unless distributed locking is added.
  enabled: true
  replicas: 1
  podAnnotations: {}
  podLabels: {}

  # Requests and limits are mandatory for Kyverno policies.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

migrate:
  # Database migration Job. In Argo CD mode this is rendered as a Sync hook.
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300

  hook:
    # If false, the Job is a normal managed resource instead of an Argo CD hook.
    enabled: true

    # Sync is used so earlier sync-wave resources can exist before the Job.
    phase: Sync

    # Delete the previous named hook before creating a new one, and clean up
    # successful runs after Argo CD observes completion.
    deletePolicy: BeforeHookCreation,HookSucceeded

  podAnnotations: {}
  podLabels: {}

  # Requests and limits are mandatory for Kyverno policies.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  # Creates one Ingress object on one host. The longest Prefix route sends
  # proxyPath to the proxy while / serves the API and frontend.
  enabled: true
  className: haproxy
  host: promptgate.example.com

  # Public path for the proxy. Prompt Gate removes this prefix internally;
  # HAProxy forwards the original path without a rewrite rule.
  proxyPath: /remote

  # Annotations shared by both routes in the single Ingress. HAProxy appends
  # the connection source to X-Forwarded-For for backend client-IP resolution.
  annotations:
    haproxy.org/forwarded-for: "true"

  tls:
    enabled: true
    secretName: promptgate-tls
