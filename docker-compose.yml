name: promptgate

x-promptgate-image: &promptgate-image
  image: promptgate-backend:local
  build:
    context: .
    dockerfile: Dockerfile

x-promptgate-service: &promptgate-service
  <<: *promptgate-image
  volumes:
    - ./deploy/config/promptgate.compose.yaml:/etc/prompt-gate/promptgate.yaml:ro

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: promptgate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
      - --hostname=http://keycloak.localhost:8082
      - --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./deploy/keycloak/promptgate-realm.json:/opt/keycloak/data/import/promptgate-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep '200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *promptgate-service
    command: ["/app/promptgate", "--config", "/etc/prompt-gate/promptgate.yaml", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: postgres
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d promptgate <<'SQL'
        INSERT INTO providers (
          id,
          name,
          display_name,
          type,
          base_url,
          api_key_ciphertext,
          config,
          enabled,
          created_at,
          updated_at,
          deleted_at
        )
        VALUES (
          '00000000-0000-0000-0000-000000000001',
          'ollama',
          'Local Ollama',
          'ollama',
          'http://host.docker.internal:11434/v1',
          '',
          '{}'::jsonb,
          true,
          NOW(),
          NOW(),
          NULL
        )
        ON CONFLICT (name) DO NOTHING;
        SQL
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  seed-cache:
    image: redis:8-alpine
    command:
      [
        "redis-cli",
        "-u",
        "redis://redis:6379/0",
        "DEL",
        "promptgate:config:snapshot:providers",
      ]
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *promptgate-service
    command: ["/app/promptgate", "--config", "/etc/prompt-gate/promptgate.yaml", "api"]
    ports:
      - "8080:8080"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    <<: *promptgate-service
    command: ["/app/promptgate", "--config", "/etc/prompt-gate/promptgate.yaml", "proxy"]
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      seed-cache:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *promptgate-service
    command: ["/app/promptgate", "--config", "/etc/prompt-gate/promptgate.yaml", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  schedule:
    <<: *promptgate-service
    command: ["/app/promptgate", "--config", "/etc/prompt-gate/promptgate.yaml", "schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
